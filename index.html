<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script>
window.segnalaErrore = function (msg) {
  var d = document.getElementById("erroreGioco");
  if (!d) {
    d = document.createElement("div"); d.id = "erroreGioco";
    d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99;background:#b00020;color:#fff;font:12px/1.4 monospace;padding:8px;word-break:break-word";
    (document.body || document.documentElement).appendChild(d);
  }
  if (d.textContent !== msg) d.textContent = msg;
};
window.addEventListener("error", function (e) {
  window.segnalaErrore("Errore: " + (e.message || "?") + (e.lineno ? " (riga " + e.lineno + ")" : ""));
});
</script>
<style>
  :root {
    --gb0: #9bbc0f;  /* verde più chiaro */
    --gb1: #8bac0f;
    --gb2: #306230;
    --gb3: #0f380f;  /* verde più scuro */
    --scocca: #c9c5bd;
    --scocca-ombra: #a9a49a;
    --tasto: #8e2c4f;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #3b3f45; font-family: "Press Start 2P", monospace; padding: 16px; gap: 14px;
    user-select: none; -webkit-user-select: none;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;   /* Android non deve ingrandire i testi da solo */
  }

  /* ---- La console ---- */
  .console {
    width: min(380px, 100%); background: var(--scocca); border-radius: 14px 14px 56px 14px;
    padding: 22px 22px 34px; box-shadow: inset -6px -6px 0 var(--scocca-ombra), 0 18px 40px rgba(0,0,0,.35);
  }
  .cornice { background: #5e6069; border-radius: 10px 10px 34px 10px; padding: 18px 26px 12px; }
  .schermo { position: relative; }
  canvas { width: 100%; display: block; image-rendering: pixelated; background: var(--gb0); }
  .marchio { color: #b7b9c2; font-size: 8px; margin-top: 10px; text-align: center; }
  .overlay {
    position: absolute; inset: 0; background: var(--gb0); color: var(--gb3);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; font-size: 9px; line-height: 1.7; padding: 10px;
  }
  .overlay h2 { font-size: 1.444em; line-height: 1.4; }
  .overlay.sopra { background: rgba(15, 56, 15, .6); color: var(--gb0); }
  .lampeggia { animation: lampeggio 1s steps(2) infinite; }
  @keyframes lampeggio { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .lampeggia { animation: none; } }
  .dialogo {
    position: absolute; left: 4px; right: 4px; bottom: 4px; min-height: 34px;
    background: var(--gb0); color: var(--gb3); border: 2px solid var(--gb3);
    font-size: 7px; line-height: 1.7; padding: 5px 6px;
  }
  .dialogo.alto { top: 4px; bottom: auto; }
  /* I messaggi durante il gioco: piccoli, in alto, sotto la barra dei bulloni, lontani da Pip */
  .dialogo.avviso { top: 20px; bottom: auto; min-height: 0; font-size: 6px; padding: 3px 5px; text-align: center; }
  .nascosto { display: none !important; }
  /* ---- Il titolo in stile anni '80 ---- */
  .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .logo .grande { font-size: 34px; letter-spacing: 3px; color: var(--gb0);
    text-shadow: 2px 2px 0 var(--gb1), 4px 4px 0 var(--gb2), 6px 6px 0 var(--gb3); }
  .logo .grande span { display: inline-block; animation: rimbalzo 1.4s ease-in-out infinite; }
  .logo .grande span:nth-child(2) { animation-delay: .15s; }
  .logo .grande span:nth-child(3) { animation-delay: .3s; }
  .logo .sotto { font-size: 9px; color: var(--gb0); text-shadow: 1px 1px 0 var(--gb3); letter-spacing: 1px; }
  .logo .riga { width: 120px; height: 2px; background: var(--gb0); box-shadow: 0 3px 0 var(--gb2); margin: 2px 0 4px; }
  .logo .firma { font-size: 11px; color: var(--gb0); letter-spacing: 2px; text-shadow: 1px 1px 0 var(--gb3), 2px 2px 0 var(--gb2);
    animation: firma 1.2s infinite; }
  .lampeggia { animation: firma 1s steps(1) infinite; }
  @keyframes firma { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }
  .suggerimento { display: block; margin-top: 6px; font-size: 8px; color: var(--gb0); line-height: 1.7; text-shadow: 1px 1px 0 var(--gb3); }
  @keyframes rimbalzo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce) { .logo .grande span, .logo .firma { animation: none; } }

  /* ---- I comandi ---- */
  .comandi { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; }
  .croce { position: relative; width: 96px; height: 96px; }
  .croce button { position: absolute; width: 32px; height: 32px; background: #2b2b30; border: none; }
  .croce .su { left: 32px; top: 0; border-radius: 4px 4px 0 0; }
  .croce .giu { left: 32px; top: 64px; border-radius: 0 0 4px 4px; }
  .croce .sx { left: 0; top: 32px; border-radius: 4px 0 0 4px; }
  .croce .dx { left: 64px; top: 32px; border-radius: 0 4px 4px 0; }
  .croce::after { content: ""; position: absolute; left: 32px; top: 32px; width: 32px; height: 32px; background: #2b2b30; }
  .ab { display: flex; gap: 14px; transform: rotate(-25deg); }
  .ab div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 8px; color: #5a4a6b; }
  .ab button {
    width: 46px; height: 46px; border-radius: 50%; background: var(--tasto); border: none;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.25);
  }
  .start { display: flex; justify-content: center; gap: 20px; margin-top: 24px; }
  .start div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 7px; color: #5a4a6b; }
  .start button { width: 46px; height: 12px; border-radius: 6px; background: #7c7a82; border: none; transform: rotate(-25deg); }
  .start button { position: relative; }
  .start button::before { content: ""; position: absolute; inset: -18px -14px; }   /* area di tocco piu grande */
  button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .schermo { cursor: pointer; }
  button:active { filter: brightness(.8); }
  button:focus-visible { outline: 3px solid var(--gb0); outline-offset: 2px; }
  .aiuto { color: #c9c5bd; font-size: 8px; line-height: 2; text-align: center; max-width: 380px; }
</style>

// Trasformiamo ogni disegno in una piccola immagine, una volta sola (più veloce)
function creaSprite(disegno, palette) {
  const c = document.createElement("canvas");
  c.width = disegno[0].length; c.height = disegno.length;
  const g = c.getContext("2d");
  disegno.forEach((riga, y) => {
    [...riga].forEach((px, x) => {
      if (px === ".") return;
      g.fillStyle = palette[+px];
      g.fillRect(x, y, 1, 1);
    });
  });
  return c;
}
// Nello spazio lo sfondo è scuro, quindi serve una versione "negativa" degli sprite:
// è lo stesso trucco dei giochi veri, che potevano solo scambiare i 4 colori
const COLORI_NOTTE = [...COLORI].reverse();
const SPRITE = {}, SPRITE_NOTTE = {};
for (const nome in DISEGNI) {
  SPRITE[nome] = creaSprite(DISEGNI[nome], COLORI);
  SPRITE_NOTTE[nome] = creaSprite(DISEGNI[nome], COLORI_NOTTE);
}

// =====================================================================
let audio;
// Compatibile con iPhone: prefisso webkit, ripresa dopo il tocco, mai errori che bloccano il gioco
function contestoAudio() {
  if (!audio) {
    try { const AC = window.AudioContext || window.webkitAudioContext; audio = AC ? new AC() : null; }
    catch (e) { audio = null; }
  }
  if (audio && audio.state !== "running") { try { audio.resume(); } catch (e) {} }
  return audio;
}
["touchstart", "touchend", "pointerdown", "click", "keydown"].forEach(ev =>
  document.addEventListener(ev, contestoAudio, { passive: true }));
function suona(note, durata = 0.07, volume = 0.05) {
  if (!contestoAudio()) return;
  try {
  const t = audio.currentTime;
  note.forEach((freq, i) => {
    const osc = audio.createOscillator(), vol = audio.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    vol.gain.setValueAtTime(volume, t + i * durata);
    vol.gain.exponentialRampToValueAtTime(0.001, t + (i + 1) * durata);
    osc.connect(vol).connect(audio.destination);
    osc.start(t + i * durata);
    osc.stop(t + (i + 1) * durata);
  });
  } catch (e) { /* audio non disponibile: il gioco continua */ }
}

const canvas = document.getElementById("gioco");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;          // pixel nitidi anche quando ingrandiamo
const T = 8;                                 // dimensione di una casella
let mappa, larghezza, pip, nemici, colpi, monetine, telecamera, fotogramma = 0;
let livello = 0, pezziTrovati = 0, monete = 0, moneteInizioLivello = 0, vite = VITE_INIZIALI;
let stato = "spento", timerStato = 0;
let boss = null, colpiNemici = [], effetti = [], pezzoCadente = null, scossa = 0;
// I poteri che Pip si porta dietro. Armatura e sparo doppio si perdono morendo, gli stivali restano
let poteri = { armatura: false, doppio: false, stivali: false };
let avvisoTimer = 0;
let oggettiVolanti = [];   // potenziamenti appena usciti da una cassa, che cadono a terra
let checkpointBoss = false, moneteCheckpoint = 0;

const SOLIDI = "#B*Uad%1234GW";
function casella(cx, cy) {
  if (cx < 0 || cx >= larghezza) return "#";   // muri invisibili ai lati
  if (cy < 0 || cy >= mappa.length) return ".";
  return mappa[cy][cx];
}
const solido = (cx, cy) => SOLIDI.includes(casella(cx, cy));

function caricaLivello(n) {
  livello = n;
  larghezza = Math.max(...MAPPE[n].map(r => r.length));
  mappa = MAPPE[n].map(r => r.padEnd(larghezza, ".").split(""));
  nemici = []; colpi = []; monetine = [];
  boss = null; colpiNemici = []; effetti = []; pezzoCadente = null; scossa = 0; oggettiVolanti = [];
  piattaforme = []; friabili = {}; tempoLivello = 0; acidoY = mappa.length * T + 20; liane = [];
  mappa.forEach((riga, y) => riga.forEach((ch, x) => {
    if (ch === "=" || ch === "!" || ch === "~") {
      piattaforme.push({ tipo: ch === "!" ? "verticale" : "orizzontale", x0: x * T, y0: y * T, x: x * T, y: y * T, w: 24, h: 5, dx: 0, dy: 0,
                         fase: piattaforme.length * 1.7, fragile: ch === "~", crepa: 0, caduta: 0, vCaduta: 0 });
      riga[x] = ".";
    }
    if (ch === "v") {
      const ax = x * T + 4, ay = y * T;
      liane.push({ ax, ay, lunghezza: 50, angolo: (liane.length % 2 ? -1 : 1) * 0.7, vel: 0, fase: liane.length * 1.9, x: ax, y: ay + 50 });
      riga[x] = ".";
    }
    if (ch === "P") {
      pip = { x: x * T + 1, y: y * T, w: 6, h: 8, vx: 0, vy: 0, aTerra: false, versoSinistra: false, coyote: 0, ricarica: 0,
              invulnerabile: 0, carburante: carburanteMassimo(), appeso: null, riaggancioTimer: 0 };
      riga[x] = ".";
    }
    if (ch === "S" && poteri.stivali) riga[x] = ".";   // gli stivali li hai già
    const nuovo = creaNemico(ch, x, y);
    if (nuovo) { nemici.push(nuovo); riga[x] = "."; }
  }));
  Object.assign(pip, poteri);
  telecamera = 0;
  telecameraY = LIVELLI[n].verticale ? Math.max(0, Math.min(pip.y - 72, mappa.length * T - 144)) : 0;
  modoRover = false;
  if (LIVELLI[n].rover) preparaRover(PISTA_3, false);
  preparaPorte();                                      // le porte musicali del tempio (se ci sono)   // il livello 3 si gioca tutto col rover
  // Prima di giocare, un cartello con il nome del livello
  stato = "cartello"; timerStato = 100;
  mostraOverlay(true, `Livello ${n + 1}`, LIVELLI[n].nome, "");
}

// Trasforma un carattere della mappa nel nemico corrispondente
function creaNemico(ch, x, y) {
  const base = { x: x * T, vy: 0, morto: 0, lampo: 0, spinta: 0 };
  if (ch === "E") return { ...base, tipo: "base", y: y * T + 1, w: 8, h: 7, vx: -FISICA.velocitaNemici };
  if (ch === "K") return { ...base, tipo: "corazzato", y: y * T + 1, w: 8, h: 7, vx: -NEMICI.corazzato.velocita, vita: NEMICI.corazzato.vita, stordito: 0 };
  if (ch === "T") return { ...base, tipo: "torretta", y: y * T, w: 8, h: 8, vx: 0, vita: NEMICI.torretta.vita, timer: 0, verso: -1 };
  if (ch === "Y") return { ...base, tipo: "torretta", mira: true, y: y * T, w: 8, h: 8, vx: 0, vita: NEMICI.torretta.vita, timer: 40, verso: -1 };
  if (ch === "V") return { ...base, tipo: "pipistrello", y: y * T, w: 8, h: 6, vx: 0, sveglio: false };
  if (ch === "L") return { ...base, tipo: "pila", fondo: (y + 1) * T, altezza: 3, y: (y + 1) * T - 24, w: 8, h: 24, vx: 0, timer: 0 };
  return null;
}

// Il serbatoio degli stivali si ingrandisce con il premio del bonus perfetto
const carburanteMassimo = () => STIVALI.carburante + (poteri.serbatoio || 0);

function entraNelLivello(n) {
  moneteInizioLivello = monete; checkpointBoss = false; checkpoint = null; roverCheckpoint = null;
  caricaLivello(n);
}

// Dopo una sconfitta: se eri già arrivato al boss, riparti direttamente dallo scontro
function riprova() {
  if (LIVELLI[livello].rover) {
    // Col rover si riparte dall'ultima tappa raggiunta (o direttamente dall'astronave madre)
    monete = checkpointBoss ? moneteCheckpoint : roverCheckpoint ? roverCheckpoint.monete : moneteInizioLivello;
    caricaLivello(livello);
    if (checkpointBoss) {
      rover.x = inizioArena() + 20; rover.y = suoloPista(rover.x + 8); telecamera = inizioArena();
      boss = creaMadre(); boss.y = 18; boss.fase = "lotta";
      ostacoli = ostacoli.filter(o => o.tipo !== "arrivoUfo"); ufo = [];   // gli UFO della pianura non tornano nell'arena
    }
    return;
  }
  if (checkpointBoss && LIVELLI[livello].boss.tipo === "condor") {
    monete = moneteCheckpoint;
    caricaLivello(livello);
    pip.x = 30; pip.y = 16 * T - 8; telecameraY = 0; chiudiArena();
    boss = creaCondor(); boss.y = 14; boss.fase = "lotta"; acidoY = ACIDO.limite;
  } else if (checkpointBoss && LIVELLI[livello].boss.tipo === "organo") {
    monete = moneteCheckpoint;
    caricaLivello(livello);
    for (const p of porte) apriPortaSubito(p);
    pip.x = arenaX() + 4; telecamera = arenaX();
    boss = creaOrgano(); boss.fase = "lotta";
  } else if (checkpointBoss && LIVELLI[livello].boss.tipo === "gorilla") {
    monete = moneteCheckpoint;
    caricaLivello(livello);
    pip.x = arenaX() + 4; telecamera = arenaX();
    boss = creaGorilla(); boss.fase = "lotta"; boss.y = RAMI_GORILLA[0].y;
  } else if (checkpointBoss) {
    monete = moneteCheckpoint;
    caricaLivello(livello);
    pip.x = arenaX() + 4; telecamera = arenaX();
    boss = creaBoss(); boss.y = TERRA_BOSS; boss.fase = "lotta";
  } else if (checkpoint) {
    // Riparti dal checkpoint, con l'acido un po' più in basso
    monete = checkpoint.monete;
    caricaLivello(livello);
    for (const p of porte) if (p.col * T < checkpoint.x) apriPortaSubito(p);   // le porte già aperte restano aperte
    pip.x = checkpoint.x; pip.y = checkpoint.y;
    telecameraY = Math.max(0, Math.min(pip.y - 72, mappa.length * T - 144));
    acidoY = pip.y + 130; tempoLivello = ACIDO.ritardo;
  } else {
    monete = moneteInizioLivello;
    caricaLivello(livello);
  }
}

function nuovaPartita(daLivello = 0) {
  monete = 0; vite = VITE_INIZIALI; pezziTrovati = daLivello;   // i pezzi dei livelli saltati contano come già trovati
  poteri = { armatura: daLivello > 0, doppio: daLivello > 0, stivali: daLivello > 0, serbatoio: 0 };   // partendo da un livello avanzato: kit di base
  entraNelLivello(daLivello);
}

// ---- La sigla del titolo: un piccolo ritornello chiptune (melodia + basso) ----
let oscillatoriSigla = [];
function suonaSigla() {
  if (!contestoAudio()) return;
  fermaSigla();
  try {
  const melodia = [523, 659, 784, 1047, 988, 784, 659, 784, 880, 698, 880, 1047, 988, 784, 1047, 0];
  const basso =   [131, 131, 196, 196, 165, 165, 196, 196, 175, 175, 220, 220, 196, 196, 131, 0];
  const durata = 0.15, t0 = audio.currentTime + 0.05;
  for (const [note, volume, forma] of [[melodia, 0.045, "square"], [basso, 0.05, "triangle"]]) {
    note.forEach((f, i) => {
      if (!f) return;
      const osc = audio.createOscillator(), vol = audio.createGain();
      osc.type = forma; osc.frequency.value = f;
      vol.gain.setValueAtTime(volume, t0 + i * durata);
      vol.gain.exponentialRampToValueAtTime(0.001, t0 + (i + 0.9) * durata);
      osc.connect(vol).connect(audio.destination);
      osc.start(t0 + i * durata); osc.stop(t0 + (i + 1) * durata);
      oscillatoriSigla.push(osc);
    });
  }
  } catch (e) { /* audio non disponibile */ }
}
function fermaSigla() {
  for (const o of oscillatoriSigla) { try { o.stop(); } catch (e) {} }
  oscillatoriSigla = [];
}

const VOCI_TITOLO = [

const vociVisibili = () => segreto ? VOCI_TITOLO : VOCI_TITOLO.slice(0, 5);

const testoSceltaLivello = () => {

function avviaBoss(n) {

// =====================================================================
//  🧱 COLLISIONI: muoviamo prima in orizzontale, poi in verticale
// =====================================================================
function muovi(e) {
  const urti = { muro: false, soffitto: null, pavimento: false };

  // Orizzontale
  e.x += e.vx;
  const alto = Math.floor(e.y / T), basso = Math.floor((e.y + e.h - 0.01) / T);
  if (e.vx > 0) {
    const cx = Math.floor((e.x + e.w - 0.01) / T);
    for (let cy = alto; cy <= basso; cy++) if (solido(cx, cy)) { e.x = cx * T - e.w; e.vx = 0; urti.muro = true; }
  } else if (e.vx < 0) {
    const cx = Math.floor(e.x / T);
    for (let cy = alto; cy <= basso; cy++) if (solido(cx, cy)) { e.x = (cx + 1) * T; e.vx = 0; urti.muro = true; }
  }

  // Verticale
  e.vy = Math.min(e.vy + FISICA.gravita, FISICA.cadutaMassima);
  e.y += e.vy;
  const sx = Math.floor(e.x / T), dx = Math.floor((e.x + e.w - 0.01) / T);
  if (e.vy > 0) {
    const cy = Math.floor((e.y + e.h - 0.01) / T);
    for (let cx = sx; cx <= dx; cx++) if (solido(cx, cy)) { e.y = cy * T - e.h; e.vy = 0; urti.pavimento = true; }
  } else if (e.vy < 0) {
    const cy = Math.floor(e.y / T);
    // Controlliamo prima la casella al centro della testa: è quella che "colpisci"
    const centro = Math.floor((e.x + e.w / 2) / T);
    for (const cx of [centro, sx, dx]) {
      if (solido(cx, cy)) { e.y = (cy + 1) * T; e.vy = 0; urti.soffitto = urti.soffitto || { cx, cy }; }
    }
  }
  return urti;
}

const toccano = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// =====================================================================
//  🔁 AGGIORNAMENTO: la logica, 60 volte al secondo
// =====================================================================
function aggiorna() {
  fotogramma++;
  aggiornaEffetti();
  if (stato === "bossIntro" && timerStato === 0) suonaTemaBoss();
  if (stato === "bossIntro" && timerStato === 189) versoBoss(boss.tipo);
  if (boss && boss.fase === "lotta" && fotogramma % 100 === 0) suona([110, 131, 98, 110], 0.12, 0.022);   // basso di sottofondo
  if (stato === "bossIntro") return boss.tipo === "condor" ? aggiornaCondorIntro() : boss.tipo === "madre" ? aggiornaMadreIntro() : boss.tipo === "organo" ? aggiornaOrganoIntro() : boss.tipo === "gorilla" ? aggiornaGorillaIntro() : aggiornaBossIntro();
  if (stato === "arrivoTempio") return aggiornaArrivoTempio();
  if (stato === "panoramica") return aggiornaPanoramica();
  if (stato === "astronave") return aggiornaAstronave();
  if (stato === "bonus") return aggiornaBonus();
  if (stato === "bonusPesci") return aggiornaBonusPesci();
  if (avvisoTimer > 0 && --avvisoTimer === 0) document.getElementById("dialogo").classList.add("nascosto");
  if (stato === "bonusRover") return aggiornaRover();
  if (stato === "cartelloMini") { if (--timerStato <= 0) avviaMinigioco(); return; }
  if (stato === "bonusRana") return aggiornaBonusRana();
  if (stato === "bonusPrendi") return aggiornaBonusPrendi();

  if (stato === "cartello") {
    if (--timerStato <= 0) {
      mostraOverlay(false);
      // La prima volta che entri nella torre, la telecamera ti mostra dove devi arrivare
      if (LIVELLI[livello].panoramica && !panoramicaVista[livello]) { panoramicaVista[livello] = true; iniziaPanoramica(); }
      else if (LIVELLI[livello].arrivo && !panoramicaVista[livello]) { panoramicaVista[livello] = true; iniziaArrivoTempio(); }
      else if (LIVELLI[livello].rover && !panoramicaVista[livello]) { panoramicaVista[livello] = true; stato = "gioco"; avviso("Rover: → accelera, ← frena, A salta, B spara avanti e in alto"); avvisoTimer = 300; }
      else stato = "gioco";
    }
    return;
  }

  if (stato === "morto") {
    // Piccola animazione di caduta, poi si riparte (o game over)
    pip.vy += FISICA.gravita; pip.y += pip.vy;
    if (--timerStato <= 0) {
      if (vite > 0) riprova();
      else { stato = "fine"; mostraOverlay(true, "Game over", `Livello ${livello + 1}: ${LIVELLI[livello].nome}`, "Premi Start per riprovare"); }
    }
    return;
  }
  if (stato !== "gioco") return;
  if (modoRover) return aggiornaRover();
  if (liane.length && pip.riaggancioTimer > 0) pip.riaggancioTimer--;
  if (pip.appeso) return aggiornaAppeso();
  if (liane.length) aggiornaLiane();

  // --- Movimento di Pip ---
  const massima = tasti.corri ? FISICA.velocitaCorsa : FISICA.velocitaCamminata;
  if (tasti.sinistra) { pip.vx = Math.max(pip.vx - FISICA.accelerazione, -massima); pip.versoSinistra = true; }
  else if (tasti.destra) { pip.vx = Math.min(pip.vx + FISICA.accelerazione, massima); pip.versoSinistra = false; }
  else { pip.vx *= FISICA.attrito; if (Math.abs(pip.vx) < 0.05) pip.vx = 0; }

  // "Coyote time": puoi saltare per qualche fotogramma anche appena dopo essere caduto da un bordo
  pip.coyote = pip.aTerra ? 6 : pip.coyote - 1;
  if (bufferSalto > 0 && pip.coyote > 0) {
    pip.vy = -FISICA.forzaSalto; pip.coyote = 0; bufferSalto = 0; SUONI.salto();
  }
  bufferSalto--;
  // Salto variabile: se lasci il tasto presto, salti più basso
  if (!tasti.salta && pip.vy < -1.4) pip.vy = -1.4;

  // Stivali-razzo: in aria, tenendo premuto il salto, Pip sale finché ha carburante
  if (pip.stivali) {
    if (pip.aTerra) pip.carburante = Math.min(carburanteMassimo(), pip.carburante + STIVALI.ricarica);
    else if (tasti.salta && pip.vy > -0.8 && pip.carburante > 0) {
      pip.vy = Math.max(pip.vy - STIVALI.spinta, -STIVALI.velocitaMassima);
      pip.carburante--;
      if (fotogramma % 2 === 0) effetti.push({ tipo: "fiamma", x: pip.x + 1 + Math.random() * 4, y: pip.y + 8, vx: 0, vy: 0.6, t: 8 });
      if (fotogramma % 6 === 0) SUONI.razzo();
    }
  }
  if (pip.invulnerabile > 0) pip.invulnerabile--;

  // Le piattaforme mobili si spostano e, se Pip ci sta sopra, lo trasportano
  tempoLivello++;
  aggiornaPiattaforme();
  if (pip.suPiattaforma) { pip.x += pip.suPiattaforma.dx; pip.y += pip.suPiattaforma.dy; }
  const piediPrima = pip.y + pip.h;

  const urti = muovi(pip);
  pip.aTerra = urti.pavimento;
  if (liane.length && !pip.riaggancioTimer) {
    const px = pip.x + pip.w / 2, py = pip.y + 2;
    const px0 = px - pip.vx, py0 = py - pip.vy;      // dove eri, circa, un fotogramma fa
    for (const l of liane) {
      if (distanzaSegmento(l.x, l.y, px0, py0, px, py) < LIANA.raggioAggancio) { pip.appeso = l; bufferSalto = 0; SUONI.clink(); break; }
    }
    if (pip.appeso) return aggiornaAppeso();
  }
  appoggiaSuPiattaforme(piediPrima);
  controllaFriabili(); aggiornaFriabili();
  // Le campane del tempio suonano quando ci atterri sopra (basta anche un piede solo)
  const rigaPiedi = Math.floor((pip.y + pip.h + 1) / T);
  const sottoCentro = casella(Math.floor((pip.x + 3) / T), rigaPiedi);
  const sottoSinistro = casella(Math.floor(pip.x / T), rigaPiedi), sottoDestro = casella(Math.floor((pip.x + pip.w - 0.01) / T), rigaPiedi);
  const sottoPiedi = "1234".includes(sottoCentro) ? sottoCentro : "1234".includes(sottoSinistro) ? sottoSinistro : sottoDestro;
  const campana = pip.aTerra && "1234".includes(sottoPiedi) ? sottoPiedi : null;
  if (campana && campana !== pip.ultimaCampana) campanaSuonata(+campana);
  pip.ultimaCampana = campana;
  if (porte.length) aggiornaPorte();

  // Testata contro un blocco
  if (urti.soffitto) {
    const { cx, cy } = urti.soffitto;
    const blocco = mappa[cy][cx];
    if (blocco === "*") {
      mappa[cy][cx] = "U"; prendiBullone();
      monetine.push({ x: cx * T, y: (cy - 1) * T, vita: 20 });
    } else if (blocco === "a" || blocco === "d") {
      // La cassa si apre e il potenziamento salta fuori, poi cade a terra lì accanto
      mappa[cy][cx] = "U"; SUONI.potere();
      oggettiVolanti.push({ ch: blocco.toUpperCase(), x: cx * T, y: (cy - 1) * T, vx: pip.versoSinistra ? -0.6 : 0.6, vy: -2.2 });
    } else SUONI.botta();
  }

  // --- Sparo ---
  pip.ricarica--;
  const massimi = pip.doppio ? SPARO.massimi * 2 : SPARO.massimi;
  if (tasti.spara && pip.ricarica <= 0 && colpi.length < massimi) {
    const dir = pip.versoSinistra ? -1 : 1;
    // Nell'arena del gorilla (sta sui rami, in alto) Pip spara dritto verso l'alto
    const controGorilla = boss && boss.tipo === "gorilla";
    const partenza = controGorilla
      ? { x: pip.x + pip.w / 2 - 1, y: pip.y - 3, w: 2, h: 3, vx: 0, vy: -SPARO.velocita, vita: SPARO.durata }
      : { x: dir > 0 ? pip.x + pip.w : pip.x - 3, y: pip.y + 4, w: 3, h: 2, vx: dir * SPARO.velocita, vy: 0, vita: SPARO.durata };
    colpi.push(partenza);
    // Con lo sparo doppio parte anche un secondo colpo in diagonale verso l'alto
    if (pip.doppio) colpi.push({ ...partenza, vx: dir * SPARO.velocita * (controGorilla ? 0.5 : 0.85), vy: controGorilla ? -SPARO.velocita * 0.85 : -1.3 });
    pip.ricarica = SPARO.ricarica;
    SUONI.sparo();
  }
  for (const c of colpi) {
    c.x += c.vx; c.y += c.vy; c.vita--;
    // Si ferma contro muri e blocchi
    if (solido(Math.floor((c.x + 1) / T), Math.floor(c.y / T))) c.vita = 0;
    // Colpisce il primo nemico che tocca
    for (const n of nemici) {
      if (!n.morto && c.vita > 0 && toccano(c, n)) { c.vita = 0; colpisciNemico(n, c); }
    }
    colpisciBoss(c);
  }
  colpi = colpi.filter(c => c.vita > 0);

  // Potenziamenti in volo: cadono, rimbalzano sui muri e si posano sul terreno
  for (const o of oggettiVolanti) {
    o.vy = Math.min(o.vy + 0.15, 3);
    if (solido(Math.floor((o.x + 4 + o.vx * 4) / T), Math.floor((o.y + 4) / T))) o.vx = -o.vx;
    o.x += o.vx; o.y += o.vy;
    const cx = Math.floor((o.x + 4) / T), cy = Math.floor((o.y + 8) / T);
    if (toccano(pip, { x: o.x, y: o.y, w: 8, h: 8 })) { o.via = true; raccogli(o.ch); }
    else if (o.vy > 0 && solido(cx, cy) && o.y + 8 - o.vy <= cy * T) {
      // Si posa solo su una casella libera: se c'è già qualcosa (per esempio un punzone) rimbalza più in là
      if (mappa[cy - 1][cx] === ".") { mappa[cy - 1][cx] = o.ch; o.via = true; }
      else { o.y = (cy - 1) * T; o.vy = -1.8; if (!o.vx) o.vx = 0.6; }
    }
    else if (o.y > mappa.length * T) o.via = true;
  }
  oggettiVolanti = oggettiVolanti.filter(o => !o.via);

  // Bulloni, potenziamenti, punzoni e pezzo del motore
  const cx1 = Math.floor(pip.x / T), cx2 = Math.floor((pip.x + pip.w - 0.01) / T);
  const cy1 = Math.floor(pip.y / T), cy2 = Math.floor((pip.y + pip.h - 0.01) / T);
  for (let cy = cy1; cy <= cy2; cy++) for (let cx = cx1; cx <= cx2; cx++) {
    const ch = casella(cx, cy);
    if ("oADS".includes(ch)) { mappa[cy][cx] = "."; raccogli(ch); }
    // I punzoni fanno male solo se ci metti i piedi sopra (non se li sfiori di lato in aria)
    if (ch === "^" && pip.y + pip.h > cy * T + 3) { danneggia(); if (stato !== "gioco") return; }
    if (ch === "M") { mappa[cy][cx] = "."; return pezzoTrovato(); }
  }
  // Il checkpoint si attiva appena ci passi accanto, sulla stessa sporgenza
  for (let cx = cx1 - 3; cx <= cx2 + 3; cx++) {
    if (casella(cx, cy2) === "C" && !(checkpoint && checkpoint.cx === cx && checkpoint.cy === cy2)) attivaCheckpoint(cx, cy2);
  }

  // --- Nemici ---
  const nuoviNemici = [];
  for (const n of nemici) {
    if (n.lampo) n.lampo--;
    if (n.morto) {
      n.morto--;
      if (n.colpito) n.y -= 0.4;       // colpito: vola via lampeggiando
      if (n.morto === 0) n.via = true;
      continue;
    }
    if (Math.abs(n.x - pip.x) > 180 || Math.abs(n.y - pip.y) > 140) continue;   // dormono finché sono lontani
    if (n.tipo === "torretta") aggiornaTorretta(n);
    else if (n.tipo === "pila") aggiornaPila(n, nuoviNemici);
    else if (n.tipo === "pipistrello") aggiornaPipistrello(n);
    else camminaNemico(n);

    if (!n.stordito && toccano(pip, n)) {
      const dallAlto = pip.vy > 0 && pip.y + pip.h - n.y < 5;
      if (dallAlto && (n.tipo === "base" || n.tipo === "carica" || n.tipo === "pipistrello")) {
        n.morto = 30; pip.vy = -2.6; SUONI.schiaccia();
      } else if (dallAlto && n.tipo === "corazzato") {
        n.stordito = 100; pip.vy = -2.8; SUONI.clink();          // il guscio regge, ma resta stordito
      } else if (dallAlto && n.tipo === "pila") {
        pip.vy = -2.8; togliDallaPila(n);
      } else {
        danneggia(); if (stato !== "gioco") return;
      }
    }
  }
  nemici.push(...nuoviNemici);
  aggiornaColpiNemici(); if (stato !== "gioco") return;
  nemici = nemici.filter(n => !n.via && n.y < mappa.length * T && n.y < acidoY);

  // Caduto in una buca
  if (pip.y > (verticale() ? mappa.length * T : 150)) return muori();
  aggiornaAcido(); if (stato !== "gioco") return;

  // --- Il boss ---
  if (boss) { if (boss.tipo === "condor") aggiornaCondor(); else if (boss.tipo === "organo") aggiornaOrgano(); else if (boss.tipo === "gorilla") aggiornaGorilla(); else aggiornaBoss(); if (stato !== "gioco") return; }

  // --- Telecamera: segue Pip, ma nell'arena del boss si blocca ---
  const infoBoss = LIVELLI[livello].boss;
  if (verticale()) {
    // Nella torre la telecamera segue Pip in verticale (e in cima si ferma sull'arena)
    telecamera = 0;
    const obiettivo = boss ? 0 : Math.max(0, Math.min(pip.y - 72, mappa.length * T - 144));
    telecameraY += (obiettivo - telecameraY) * (boss ? 0.12 : 0.25);
    if (infoBoss && !boss && pip.aTerra && pip.y + pip.h <= 17 * T) return iniziaCondorIntro();
  } else if (boss) {
    telecamera += (arenaX() - telecamera) * 0.12;
    pip.x = Math.max(arenaX(), Math.min(pip.x, arenaX() + 160 - pip.w));   // non si scappa!
  } else {
    telecamera = Math.max(0, Math.min(pip.x - 72, larghezza * T - 160));
    if (infoBoss && pip.x > infoBoss.arena * T + 6) return infoBoss.tipo === "organo" ? iniziaOrganoIntro() : infoBoss.tipo === "gorilla" ? iniziaGorillaIntro() : iniziaBossIntro();
  }

  monetine.forEach(m => { m.y -= 1; m.vita--; });
  monetine = monetine.filter(m => m.vita > 0);
}

function muori() {
  stato = "morto"; vite--; timerStato = 90; pip.vy = -3.5; SUONI.morte();
  poteri.armatura = false; poteri.doppio = false;   // gli stivali invece restano
}

// Pip viene colpito: se ha l'armatura la perde (come Arthur in Ghosts 'n Goblins), altrimenti perde una vita
function danneggia() {
  if (pip.invulnerabile > 0) return;
  if (pip.armatura) {
    pip.armatura = poteri.armatura = false;
    pip.invulnerabile = 90; pip.vy = -2.5;
    SUONI.armatura();
    for (let k = 0; k < 10; k++) effetti.push({ tipo: "pezzetto", x: pip.x + 3, y: pip.y + 2, vx: Math.random() * 3 - 1.5, vy: -Math.random() * 2 - 1, t: 40 });
    return;
  }
  muori();
}

function raccogli(ch) {
  if (ch === "o") return prendiBullone();
  SUONI.potere();
  if (ch === "A") { pip.armatura = poteri.armatura = true; avviso("Armatura! Ti protegge da un colpo"); }
  if (ch === "D") { pip.doppio = poteri.doppio = true; avviso("Sparo doppio! Un colpo dritto e uno in alto"); }
  if (ch === "S") { pip.stivali = poteri.stivali = true; avviso("Stivali-razzo! In aria tieni premuto il salto"); }
}

function attivaCheckpoint(cx, cy) {
  checkpoint = { x: cx * T + 1, y: cy * T, cx, cy, monete };
  SUONI.potere(); avviso("Checkpoint! Se cadi, riparti da qui");
}

function prendiBullone(silenzioso) {
  monete++; if (!silenzioso) SUONI.moneta();
  if (monete % BULLONI_PER_VITA === 0) { vite++; SUONI.vita(); avviso(`${BULLONI_PER_VITA} bulloni: una vita in più!`); }
}

// Un messaggio che compare in basso per qualche secondo
function avviso(testo) {
  const d = document.getElementById("dialogo");
  d.classList.remove("nascosto", "alto"); d.classList.add("avviso"); d.textContent = testo;
  avvisoTimer = 110;   // poco meno di 2 secondi
}

// Nemici che camminano: scarafaggi, corazzati e piccoletti in carica
function camminaNemico(n) {
  if (n.stordito > 0) { n.stordito--; n.vx = 0; muovi(n); if (n.stordito === 0) n.vx = -NEMICI.corazzato.velocita; return; }
  const velocita = n.tipo === "corazzato" ? NEMICI.corazzato.velocita : n.tipo === "carica" ? NEMICI.carica.velocita : FISICA.velocitaNemici;
  const direzione = Math.sign(n.vx) || -1;
  n.vx = direzione * velocita + n.spinta;
  n.spinta *= 0.8;
  const u = muovi(n);
  // Si girano contro i muri, sul bordo di un precipizio o davanti ai punzoni
  const piede = Math.floor((direzione > 0 ? n.x + n.w + 1 : n.x - 1) / T);
  const sotto = Math.floor((n.y + n.h + 1) / T);
  const davanti = casella(piede, Math.floor((n.y + n.h - 1) / T));
  const girati = u.muro || davanti === "^" || (u.pavimento && !solido(piede, sotto));
  n.vx = (girati ? -direzione : direzione) * velocita;
  // I piccoletti in carica ogni tanto fanno un saltello
  if (n.tipo === "carica" && u.pavimento && Math.random() < 0.02) n.vy = -2.4;
}

// La torretta: ogni tanto lampeggia (sta caricando!) e poi spara verso Pip
function aggiornaTorretta(n) {
  n.timer++;
  n.verso = Math.sign(pip.x - n.x) || -1;
  if (n.timer % NEMICI.torretta.cadenza === 0) {
    if (n.mira) {
      // Questa torretta punta dritta verso Pip, anche in diagonale
      const dx = pip.x - n.x, dy = pip.y - n.y, d = Math.hypot(dx, dy) || 1;
      colpiNemici.push({ x: n.x + 2, y: n.y + 2, w: 4, h: 4, vx: dx / d * NEMICI.torretta.velocitaColpi, vy: dy / d * NEMICI.torretta.velocitaColpi });
    } else colpiNemici.push({ x: n.verso < 0 ? n.x - 4 : n.x + 8, y: n.y + 3, w: 4, h: 4, vx: n.verso * NEMICI.torretta.velocitaColpi, vy: 0 });
    SUONI.sparoBoss();
  }
}
const torrettaInCarica = n => n.timer % NEMICI.torretta.cadenza > NEMICI.torretta.cadenza - 40;

// La pila: quando Pip si avvicina, il piccoletto in cima si stacca e gli corre incontro
function aggiornaPila(n, nuovi) {
  if (Math.abs(pip.x - n.x) > NEMICI.pila.distanza) return;
  n.timer++;
  if (n.timer % NEMICI.pila.intervallo === 0) {
    const dir = Math.sign(pip.x - n.x) || -1;
    nuovi.push({ tipo: "carica", x: n.x, y: n.fondo - n.altezza * T, w: 8, h: 7, vx: dir * NEMICI.carica.velocita, vy: -2.2, morto: 0, lampo: 0, spinta: 0 });
    togliDallaPila(n, true);
  }
}
function togliDallaPila(n, silenzioso) {
  n.altezza--;
  n.h = n.altezza * T; n.y = n.fondo - n.h;
  if (!silenzioso) SUONI.colpito();
  if (n.altezza <= 0) n.via = true;
}

// Cosa succede quando un colpo di Pip prende un nemico
function colpisciNemico(n, c) {
  if (n.tipo === "corazzato" || n.tipo === "torretta") {
    n.vita--; n.lampo = 8;
    if (n.tipo === "corazzato") n.spinta = Math.sign(c.vx) * 2;   // il colpo lo spinge indietro
    if (n.vita > 0) return SUONI.clink();
  }
  if (n.tipo === "pila") return togliDallaPila(n);
  n.morto = 24; n.colpito = true; SUONI.colpito();
}

// I colpi di torrette e boss
function aggiornaColpiNemici() {
  for (const c of colpiNemici) {
    if (c.banana) {                                    // le banane del gorilla: prima volano, poi rotolano per terra
      if (!c.rotola) {
        c.vy += 0.05; c.x += c.vx; c.y += c.vy;
        const cx = Math.floor((c.x + 2) / T), cy = Math.floor((c.y + 4) / T);
        if (solido(cx, cy + 1)) { c.rotola = true; c.vy = 0; c.vx = c.vx > 0 ? 0.9 : -0.9; c.t = 0; SUONI.clink(); }
        else if (c.y > telecameraY + 160) c.via = true;
      } else {
        c.t++; c.x += c.vx;
        const cx = Math.floor((c.x + 2) / T), cy = Math.floor((c.y + 4) / T);
        if (!solido(cx, cy + 1)) { c.rotola = false; c.vy = 0.2; }   // rotola oltre il bordo: ricade
        if (solido(cx, cy)) c.via = true;                            // sbatte contro un muro
        if (c.t > 220) c.via = true;
      }
      if (!c.via && toccano(c, pip)) { c.via = true; danneggia(); if (stato !== "gioco") return; }
      continue;
    }
    c.x += c.vx; c.y += c.vy;
    if (solido(Math.floor((c.x + 2) / T), Math.floor((c.y + 2) / T)) || Math.abs(c.x - pip.x) > 200 || c.y > telecameraY + 160 || c.y < telecameraY - 30) c.via = true;
    else if (toccano(c, pip)) { c.via = true; danneggia(); if (stato !== "gioco") return; }
  }
  colpiNemici = colpiNemici.filter(c => !c.via);
}

function pezzoTrovato() {
  pezziTrovati++;
  sbloccaLivello(livello + 1);          // livello finito: si apre il prossimo
  SUONI.pezzo();
  iniziaAstronave();   // Pip torna all'astronave a montarlo
}

// =====================================================================
//  🖌️ DISEGNO DEL GIOCO
// =====================================================================
function disegnaSprite(nome, x, y, specchio = false, raccolta = SPRITE) {
  const img = raccolta[nome];
  x = Math.round(x); y = Math.round(y);
  if (!specchio) return ctx.drawImage(img, x, y);
  ctx.save(); ctx.translate(x + img.width, y); ctx.scale(-1, 1);
  ctx.drawImage(img, 0, 0); ctx.restore();
}

function disegna() {
  if (stato === "astronave") return disegnaScenaAstronave();
  if (stato === "arrivoTempio") return disegnaArrivoTempio();
  if (stato === "bonusPrendi" || (stato === "pezzo" && scena && scena.prendi)) return disegnaBonusPrendi();
  if (stato === "bonusRana" || (stato === "pezzo" && scena && scena.rana)) return disegnaBonusRana();
  if (stato === "bonus" || (stato === "pezzo" && scena && scena.arrivi && !modoRover)) return disegnaBonus();
  if (stato === "bonusPesci" || (stato === "pezzo" && scena && scena.pesci)) return disegnaBonusPesci();
  if (modoRover) return disegnaRover();
  const cam = Math.round(telecamera);
  ctx.save();
  if (scossa > 0) ctx.translate(Math.round(Math.random() * 4 - 2), Math.round(Math.random() * 4 - 2));
  ctx.fillStyle = COLORI[0];
  ctx.fillRect(-4, -4, 168, 152);

  const camY = Math.round(telecameraY);
  if (verticale()) disegnaSfondoTorre(camY);
  else if (LIVELLI[livello].tempio) disegnaSfondoTempio(cam);
  else {
    // Colline sullo sfondo (si muovono più lente: effetto profondità). Ogni livello ha le sue.
    ctx.fillStyle = COLORI[1];
    const forma = 0.035 + livello * 0.012, altezza = 18 + livello * 5;
    for (let sx = 0; sx < 160; sx++) {
      const wx = sx + cam * 0.3;
      const h = Math.round(altezza + Math.sin(wx * forma) * 6 + Math.sin(wx * 0.013) * 9);
      ctx.fillRect(sx, 128 - h, 1, h);
    }
    // Nella giungla, alberi piantati sulle colline: parallasse un po' più ravvicinato delle colline stesse
    if (LIVELLI[livello].giungla) {
      const spaziatura = 42, inizio = Math.floor((cam * 0.5 - 20) / spaziatura) * spaziatura;
      for (let wx = inizio; wx < cam * 0.5 + 180; wx += spaziatura) {
        const sx = Math.round(wx - cam * 0.5);
        const h = Math.round(altezza + Math.sin(wx * forma) * 6 + Math.sin(wx * 0.013) * 9);
        const baseY = 128 - h;
        ctx.fillStyle = COLORI[3]; ctx.fillRect(sx - 1, baseY - 9, 2, 10);   // tronco
        ctx.fillStyle = COLORI[2];                                          // chioma, tre blocchi digradanti
        ctx.fillRect(sx - 5, baseY - 15, 10, 5);
        ctx.fillRect(sx - 3, baseY - 18, 6, 4);
        ctx.fillRect(sx - 2, baseY - 20, 4, 3);
      }
    }
  }

  // Da qui disegniamo il "mondo": lo spostiamo in su o in giù secondo la telecamera verticale
  ctx.save();
  ctx.translate(0, -camY);

  // Caselle del livello (solo quelle visibili)
  const primaColonna = Math.floor(cam / T), primaRiga = Math.max(0, Math.floor(camY / T));
  for (let cy = primaRiga; cy < Math.min(mappa.length, primaRiga + 20); cy++) {
    for (let cx = primaColonna; cx <= primaColonna + 20; cx++) {
      const ch = casella(cx, cy);
      if (ch === ".") continue;
      const nome = ch === "M" ? LIVELLI[livello].pezzo : (ch === "a" || ch === "d") ? "cassa" : ch === "C" ? "antenna" : "1234".includes(ch) ? "campana" + ch : ch;
      if (!SPRITE[nome]) continue;
      // Bulloni, poteri e pezzo del motore "respirano"
      const su = "oMADS".includes(ch) && Math.floor(fotogramma / 20) % 2 ? -1 : 0;
      const trema = ch === "%" && friabili[cx + "," + cy] && fotogramma % 4 < 2 ? 1 : 0;   // la roccia sta per crollare
      const accesa = "1234".includes(ch) && campaneAccese[ch] > 0;              // la campana che suona si illumina
      disegnaSprite(nome, cx * T - cam + trema, cy * T + su, false, accesa ? SPRITE_NOTTE : SPRITE);
      // Il checkpoint attivo manda onde radio
      if (ch === "C" && checkpoint && checkpoint.cx === cx && checkpoint.cy === cy) {
        const r = (fotogramma / 4) % 8;
        ctx.fillStyle = COLORI[3];
        ctx.fillRect(cx * T - cam + 2 - Math.round(r / 2), cy * T - Math.round(r / 2), 1, 1);
        ctx.fillRect(cx * T - cam + 4 + Math.round(r / 2), cy * T - Math.round(r / 2), 1, 1);
      }
    }
  }
  for (const p of piattaforme) {
    if (p.fragile && p.caduta > 160) continue;                               // è precipitata fuori dallo schermo
    const trema = p.fragile && p.crepa > FRAGILI.tremito && p.crepa < FRAGILI.crollo && fotogramma % 4 < 2 ? 1 : 0;
    const nome = !p.fragile ? "piattaforma" : p.crepa ? "piattaformaRotta" : "piattaformaFragile";
    for (let k = 0; k < 3; k++) disegnaSprite(nome, p.x + k * 8 - cam + trema, p.y);
  }
  if (liane.length) disegnaLiane(cam);

  // I rottami dell'astronave all'inizio del primo livello, con un filo di fumo
  if (livello === 0) {
    disegnaSprite("nave", -cam, 120);
    ctx.fillStyle = COLORI[2];
    for (let k = 0; k < 4; k++) {
      const salita = (fotogramma * 0.3 + k * 10) % 40;
      ctx.fillRect(Math.round(3 + Math.sin((fotogramma + k * 30) * 0.05) * 2) - cam, Math.round(120 - salita), 2, 2);
    }
  }

  monetine.forEach(m => disegnaSprite("o", m.x - cam, m.y));
  oggettiVolanti.forEach(o => disegnaSprite(o.ch, o.x - cam, o.y));

  for (const n of nemici) disegnaNemico(n, cam);

  if (boss) { if (boss.tipo === "condor") disegnaCondor(cam); else if (boss.tipo === "organo") disegnaOrgano(cam); else if (boss.tipo === "gorilla") disegnaGorilla(cam); else disegnaBoss(cam); }
  if (porte.length) disegnaPorte(cam);
  if (stato === "panoramica") disegnaCondorInCima();
  disegnaColpiEffetti(cam);

  // I colpi di Pip: un trattino scuro
  for (const c of colpi) {
    ctx.fillStyle = COLORI[3];
    ctx.fillRect(Math.round(c.x) - cam, Math.round(c.y), c.w, c.h);
  }

  // Pip (lampeggia quando è invulnerabile)
  let nomePip = "pipFermo";
  if (stato === "morto" || !pip.aTerra) nomePip = "pipSalto";
  else if (Math.abs(pip.vx) > 0.2 && Math.floor(fotogramma / 6) % 2) nomePip = "pipPasso";
  if (!(pip.invulnerabile && fotogramma % 4 < 2)) {
    disegnaSprite(nomePip, pip.x - 1 - cam, pip.y, pip.versoSinistra);
    if (pip.armatura) disegnaSprite("armatura", pip.x - 1 - cam, pip.y, pip.versoSinistra);
  }
  // Barretta del carburante sopra la testa, solo quando non è pieno
  if (pip.stivali && pip.carburante < carburanteMassimo()) {
    const bx = Math.round(pip.x - 1) - cam, by = Math.round(pip.y) - 5;
    ctx.fillStyle = COLORI[1]; ctx.fillRect(bx, by, 8, 2);
    ctx.fillStyle = COLORI[3]; ctx.fillRect(bx, by, Math.round(8 * pip.carburante / carburanteMassimo()), 2);
  }
  // Lampo alla bocca del "blaster" appena spara
  if (pip.ricarica > SPARO.ricarica - 4) {
    ctx.fillStyle = COLORI[3];
    ctx.fillRect(Math.round(pip.versoSinistra ? pip.x - 3 : pip.x + pip.w) - cam, Math.round(pip.y + 3), 2, 4);
  }

  disegnaAcido();
  ctx.restore();   // fine del "mondo": l'HUD sta sempre fermo sullo schermo

  // HUD: bulloni a sinistra, pezzi del motore al centro, vite a destra
  ctx.fillStyle = COLORI[0];
  ctx.fillRect(0, 0, 160, 10);
  disegnaSprite("o", 2, 1);
  scriviNumero("x" + monete, 11, 3);
  if (!disegnaBarraMusica()) PEZZI.forEach((nome, k) => {
    const x = 62 + k * 9;
    if (k < pezziTrovati) disegnaSprite(nome, x, 1);
    else {
      ctx.fillStyle = COLORI[2];   // casella vuota tratteggiata
      for (let p = 0; p < 8; p += 2) { ctx.fillRect(x + p, 1, 1, 1); ctx.fillRect(x + p, 8, 1, 1); ctx.fillRect(x, 1 + p, 1, 1); ctx.fillRect(x + 7, 1 + p, 1, 1); }
    }
  });
  disegnaSprite("cuore", 134, 1);
  scriviNumero("x" + Math.max(vite, 0), 143, 3);

  // Barra di energia del boss
  if (boss && (boss.fase === "lotta" || boss.fase === "esplode" || (stato === "bossIntro" && timerStato > 70))) {
    ctx.fillStyle = COLORI[3]; ctx.fillRect(54, 11, 52, 5);
    ctx.fillStyle = COLORI[0]; ctx.fillRect(55, 12, 50, 3);
    ctx.fillStyle = COLORI[3]; ctx.fillRect(55, 12, Math.round(50 * Math.max(boss.vita, 0) / boss.vitaMax), 3);
  }

  // Durante la presentazione, una vignetta con il primo piano del boss scorre sullo schermo
  if (stato === "bossIntro" && timerStato >= 150 && timerStato < 322) {
    const x = Math.round(160 * (1 - morbido((timerStato - 150) / 20)) - 160 * morbido((timerStato - 300) / 20));
    ctx.fillStyle = COLORI[3]; ctx.fillRect(x, 25, 160, 64);
    vignetta(x, 26, 160, 62, 80, () => boss.tipo === "condor" ? disegnaPrimoPianoCondor(timerStato) : boss.tipo === "organo" ? disegnaPrimoPianoOrgano(timerStato) : boss.tipo === "gorilla" ? disegnaPrimoPianoGorilla(timerStato) : disegnaPrimoPianoBoss(timerStato));
    disegnaBattutaBoss(x);
  }
  ctx.restore();
}

function disegnaNemico(n, cam) {
  if ((n.colpito || n.lampo) && fotogramma % 4 < 2) return;   // lampeggio quando colpito
  const passo = Math.floor(fotogramma / 12) % 2;
  const x = n.x - cam;
  if (n.tipo === "base") disegnaSprite(n.morto && !n.colpito ? "schiacciato" : passo ? "nemico1" : "nemico2", x, n.y - 1);
  if (n.tipo === "corazzato") {
    const nome = n.vita < NEMICI.corazzato.vita ? "corazzatoRotto" : passo ? "corazzato1" : "corazzato2";
    disegnaSprite(n.stordito ? "corazzatoRotto" : nome, x, n.y - 1);
    if (n.stordito) {   // stelline che girano sopra la testa
      ctx.fillStyle = COLORI[3];
      ctx.fillRect(Math.round(x + 3 + Math.cos(fotogramma * 0.2) * 4), Math.round(n.y - 4 + Math.sin(fotogramma * 0.2)), 1, 1);
      ctx.fillRect(Math.round(x + 3 - Math.cos(fotogramma * 0.2) * 4), Math.round(n.y - 4 - Math.sin(fotogramma * 0.2)), 1, 1);
    }
  }
  if (n.tipo === "torretta") {
    // Mentre carica il colpo lampeggia in negativo: è il segnale per prepararsi
    const raccolta = torrettaInCarica(n) && fotogramma % 6 < 3 ? SPRITE_NOTTE : SPRITE;
    disegnaSprite(n.mira ? "torrettaMira" : "torretta", x, n.y, n.verso > 0, raccolta);
  }
  if (n.tipo === "pipistrello") disegnaSprite(!n.sveglio ? "pipistrelloAppeso" : passo ? "pipistrello1" : "pipistrello2", x, n.y - 1);
  if (n.tipo === "carica") disegnaSprite("piccolo", x, n.y - 1 + (passo ? 0 : -1), n.vx > 0);
  if (n.tipo === "pila") {
    for (let k = 0; k < n.altezza; k++) {
      const oscilla = Math.round(Math.sin(fotogramma * 0.1 + k) * (k * 0.6));
      disegnaSprite("piccolo", x + oscilla, n.fondo - (k + 1) * T);
    }
  }
}

function mostraOverlay(visibile, titolo, messaggio, invito, sopraLaScena = false) {
  const overlay = document.getElementById("overlay");
  overlay.classList.toggle("nascosto", !visibile);
  overlay.classList.toggle("sopra", sopraLaScena);
  if (!visibile) return;
  document.getElementById("titolo").textContent = titolo;
  document.getElementById("messaggio").textContent = messaggio;
  document.getElementById("invito").textContent = invito;
  adattaTestoOverlay();
}
// Il testo dei cartelli deve sempre stare dentro lo schermo, qualunque sia la dimensione del telefono
function adattaTestoOverlay() {
  const overlay = document.getElementById("overlay");
  if (overlay.classList.contains("nascosto")) return;
  overlay.style.fontSize = "";
  let px = parseFloat(getComputedStyle(overlay).fontSize);
  const sta = () => {
    const o = overlay.getBoundingClientRect(), margine = 6;
    const bambini = Array.from(overlay.children).map(c => c.getBoundingClientRect()).filter(r => r.height > 0);
    if (!bambini.length) return true;
    return Math.min(...bambini.map(r => r.top)) >= o.top + margine
        && Math.max(...bambini.map(r => r.bottom)) <= o.bottom - margine
        && overlay.scrollWidth <= overlay.clientWidth;
  };
  while (!sta() && px > 4.5) { px -= 0.5; overlay.style.fontSize = px + "px"; }
}
window.addEventListener("resize", adattaTestoOverlay);

// =====================================================================
//  🗼 LIVELLO 2: LA TORRE DI ROCCIA
//  Qui lo schermo scorre verso l'alto e dal basso sale l'acido
// =====================================================================
const ACIDO = {
  velocita: 0.12,        // pixel al fotogramma
  ritardo: 240,          // quanto aspetta prima di cominciare a salire
  distanzaMassima: 36,   // non resta mai più di così sotto il bordo dello schermo (i vapori però si vedono sempre)
  limite: 20 * T + 4,    // non arriva mai nell'arena del boss
};
const PIATTAFORME = { raggio: 24, velocita: 0.025 };   // di quanto si spostano e quanto in fretta
const FRAGILI = {
  velocita: 0.045,       // le piattaforme fragili si muovono più svelte
  tremito: 70,           // fotogrammi dopo il primo contatto in cui iniziano a tremare
  crollo: 120,           // fotogrammi dopo il primo contatto in cui crollano
  ricomparsa: 200,       // fotogrammi dopo il crollo in cui ricompaiono
};
const FRIABILE = { crollo: 36, ricomparsa: 240 };      // fotogrammi prima del crollo e prima di ricomparire
let telecameraY = 0, acidoY = 9999, piattaforme = [], friabili = {}, checkpoint = null, tempoLivello = 0;
const panoramicaVista = {};

// =====================================================================
//  🌿 LE LIANE DELLA GIUNGLA: dondolano da sole come un pendolo.
//  Saltaci contro per aggrapparti, premi i lati per darti la spinta,
//  salta di nuovo per staccarti e volare con lo slancio della liana.
//  Prova a cambiare questi numeri se ti sembra troppo lenta o troppo nervosa!
// =====================================================================
const LIANA = {
  omega2: 0.0022,        // quanto è "rigido" il pendolo (più alto = oscilla più veloce)
  smorzamento: 0.9993,   // quanto lentamente si ferma
  spintaVento: 0.00035,  // il dondolio spontaneo, quando nessuno è appeso
  spintaGioco: 0.0016,   // quanto ti spingi tenendo premuto un lato
  ampiezzaMassima: 1.15, // quanto in là può oscillare (radianti)
  raggioAggancio: 15,    // a quanti pixel dal "batacchio" ti aggrappi (generoso: il salto liana-liana deve sentirsi quasi automatico)
};
// Distanza minima tra un punto (px,py) e il segmento percorso da Pip in quest'ultimo fotogramma:
// così, se durante un salto veloce "sfiori" la liana tra un fotogramma e l'altro, l'aggancio scatta comunque
// invece di richiedere di trovarsi esattamente sopra al punto giusto nel fotogramma giusto.
function distanzaSegmento(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lunghezza2 = dx * dx + dy * dy;
  let t = lunghezza2 ? ((px - x1) * dx + (py - y1) * dy) / lunghezza2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
let liane = [];
function aggiornaLiane() {
  for (const l of liane) {
    const tenuta = pip.appeso === l;
    let accel = -LIANA.omega2 * Math.sin(l.angolo);
    if (!tenuta) accel += Math.sin(fotogramma * 0.015 + l.fase) * LIANA.spintaVento;
    else { if (tasti.sinistra) accel -= LIANA.spintaGioco; if (tasti.destra) accel += LIANA.spintaGioco; }
    l.vel = (l.vel + accel) * LIANA.smorzamento;
    l.angolo = Math.max(-LIANA.ampiezzaMassima, Math.min(LIANA.ampiezzaMassima, l.angolo + l.vel));
    l.x = l.ax + Math.sin(l.angolo) * l.lunghezza;
    l.y = l.ay + Math.cos(l.angolo) * l.lunghezza;
  }
}
function disegnaLiane(cam) {
  for (const l of liane) {
    const passi = 6;
    for (let k = 1; k <= passi; k++) {
      const x = Math.round(l.ax + (l.x - l.ax) * k / passi) - cam, y = Math.round(l.ay + (l.y - l.ay) * k / passi);
      ctx.fillStyle = COLORI[2]; ctx.fillRect(x, y, 1, 3);
    }
    const hx = Math.round(l.x) - cam, hy = Math.round(l.y);   // un ciuffo di foglie in fondo, dove ci si aggrappa
    ctx.fillStyle = COLORI[2];
    ctx.fillRect(hx - 3, hy - 2, 7, 3); ctx.fillRect(hx - 2, hy - 4, 5, 2); ctx.fillRect(hx - 1, hy + 1, 3, 2);
    ctx.fillStyle = COLORI[1]; ctx.fillRect(hx - 2, hy - 3, 2, 1); ctx.fillRect(hx + 1, hy - 1, 2, 1);
  }
}
// Mentre Pip è appeso a una liana, il resto della fisica normale è sospeso
function aggiornaAppeso() {
  aggiornaLiane();
  const l = pip.appeso;
  pip.x = l.x - pip.w / 2; pip.y = l.y - 2;
  pip.versoSinistra = l.vel < 0;
  pip.vx = 0; pip.vy = 0; pip.aTerra = false;
  if (bufferSalto > 0) {
    pip.vx = Math.max(-FISICA.velocitaCorsa * 1.7, Math.min(FISICA.velocitaCorsa * 1.7, l.lunghezza * l.vel));
    pip.vy = Math.min(-0.6, -l.lunghezza * l.vel * 0.5 - 1);
    pip.appeso = null; pip.coyote = 0; bufferSalto = 0; pip.riaggancioTimer = 20; SUONI.salto();
  }
  const cx1 = Math.floor(pip.x / T), cx2 = Math.floor((pip.x + pip.w - 0.01) / T);
  const cy1 = Math.floor(pip.y / T), cy2 = Math.floor((pip.y + pip.h - 0.01) / T);
  for (let cy = cy1; cy <= cy2; cy++) for (let cx = cx1; cx <= cx2; cx++) {
    const ch = casella(cx, cy);
    if ("oADS".includes(ch)) { mappa[cy][cx] = "."; raccogli(ch); }
  }
  telecamera = Math.max(0, Math.min(pip.x - 72, larghezza * T - 160));
}
const verticale = () => !!LIVELLI[livello].verticale;

// ---- Piattaforme mobili ----
function aggiornaPiattaforme() {
  for (const p of piattaforme) {
    const primaX = p.x, primaY = p.y;
    const onda = Math.sin(tempoLivello * (p.fragile ? FRAGILI.velocita : PIATTAFORME.velocita) + p.fase);
    if (p.tipo === "orizzontale") { p.x = p.x0 + onda * PIATTAFORME.raggio; p.y = p.y0; }
    else p.y = p.y0 + onda * PIATTAFORME.raggio;
    if (p.fragile) aggiornaFragile(p);
    p.y += p.caduta;
    p.dx = p.x - primaX; p.dy = p.y - primaY;
  }
}
// Una piattaforma fragile: al primo contatto si crepa, poi trema, poi crolla e ricompare
function aggiornaFragile(p) {
  if (!p.crepa && pip.suPiattaforma === p) { p.crepa = 1; suona([300, 200], 0.04, 0.03); }
  if (!p.crepa) return;
  p.crepa++;
  if (p.crepa === FRAGILI.crollo) {
    SUONI.botta();
    for (let q = 0; q < 6; q++) effetti.push({ tipo: "pezzetto", x: p.x + Math.random() * 24, y: p.y, vx: Math.random() - 0.5, vy: 0, t: 40 });
  }
  if (p.crepa >= FRAGILI.crollo) { p.vCaduta = Math.min(p.vCaduta + 0.15, 3); p.caduta += p.vCaduta; }
  // Ricompare al suo posto, ma solo se Pip non è proprio lì
  if (p.crepa >= FRAGILI.crollo + FRAGILI.ricomparsa && !toccano(pip, { x: p.x - 4, y: p.y0 - 8, w: 32, h: 14 })) {
    p.crepa = 0; p.caduta = 0; p.vCaduta = 0;
  }
}
// Pip si appoggia su una piattaforma solo arrivando dall'alto
function appoggiaSuPiattaforme(piediPrima) {
  pip.suPiattaforma = null;
  if (pip.vy < 0) return;
  for (const p of piattaforme) {
    if (p.fragile && p.crepa >= FRAGILI.crollo) continue;   // sta crollando: non regge più
    if (pip.x + pip.w > p.x && pip.x < p.x + p.w && piediPrima <= p.y + 1 && pip.y + pip.h >= p.y) {
      pip.y = p.y - pip.h; pip.vy = 0; pip.aTerra = true; pip.suPiattaforma = p;
      return;
    }
  }
}

// ---- Rocce friabili: crollano poco dopo che ci sali, poi ricompaiono ----
function controllaFriabili() {
  if (!pip.aTerra || pip.suPiattaforma) return;
  const cy = Math.floor((pip.y + pip.h + 1) / T);
  for (let cx = Math.floor(pip.x / T); cx <= Math.floor((pip.x + pip.w - 0.01) / T); cx++) {
    const k = cx + "," + cy;
    if (casella(cx, cy) === "%" && !friabili[k]) { friabili[k] = { t: FRIABILE.crollo, cx, cy }; suona([300, 200], 0.04, 0.03); }
  }
}
function aggiornaFriabili() {
  for (const k in friabili) {
    const f = friabili[k];
    f.t--;
    if (f.t === 0) {
      mappa[f.cy][f.cx] = "."; SUONI.botta();
      for (let q = 0; q < 3; q++) effetti.push({ tipo: "pezzetto", x: f.cx * T + Math.random() * 8, y: f.cy * T + 4, vx: Math.random() - 0.5, vy: 0, t: 40 });
    }
    // Ricompare dopo un po', ma non addosso a Pip
    if (f.t <= -FRIABILE.ricomparsa && !toccano(pip, { x: f.cx * T, y: f.cy * T, w: T, h: T })) {
      mappa[f.cy][f.cx] = "%"; delete friabili[k];
    }
  }
}

// ---- L'acido che sale ----
function aggiornaAcido() {
  if (!LIVELLI[livello].acido) return;
  if (tempoLivello > ACIDO.ritardo) acidoY -= ACIDO.velocita;
  acidoY = Math.min(acidoY, telecameraY + 144 + ACIDO.distanzaMassima);   // ti sta sempre dietro
  acidoY = Math.max(acidoY, ACIDO.limite);
  if (acidoY < telecameraY + 150 && tempoLivello % 70 === 0) suona([90, 70], 0.08, 0.03);   // blub
  if (pip.y + pip.h > acidoY + 2) muori();
}
function disegnaAcido() {
  if (!LIVELLI[livello].acido) return;
  const alto = Math.round(acidoY), fondo = Math.round(telecameraY) + 150;
  // I vapori tossici salgono sopra la superficie: si vedono anche quando l'acido è appena fuori dallo schermo
  for (let k = 0; k < 18; k++) {
    const vita = ((tempoLivello * 0.5 + k * 17) % 60) / 60;           // da 0 (appena nato) a 1 (svanito)
    const vx = (k * 37 + Math.round(Math.sin(tempoLivello * 0.03 + k) * 4)) % 160;
    const vy = alto - 2 - vita * 52;                                 // salgono fino a 52 pixel sopra l'acido
    ctx.fillStyle = COLORI[vita < 0.5 ? 2 : 1];
    if (vita < 0.85) ctx.fillRect(vx, Math.round(vy), vita < 0.4 ? 2 : 1, vita < 0.4 ? 2 : 1);
  }
  if (alto > fondo) return;
  for (let x = 0; x < 160; x++) {
    const onda = Math.round(Math.sin(x * 0.2 + tempoLivello * 0.08) * 1.5);
    ctx.fillStyle = COLORI[1]; ctx.fillRect(x, alto + onda - 1, 1, 1);
    ctx.fillStyle = COLORI[2]; ctx.fillRect(x, alto + onda, 1, fondo - alto);
  }
  ctx.fillStyle = COLORI[3];   // retino scuro in profondità
  for (let y = alto + 6; y < fondo; y += 2) for (let x = (y % 4 === 0 ? 0 : 2); x < 160; x += 4) ctx.fillRect(x, y, 1, 1);
  ctx.fillStyle = COLORI[0];   // bolle che salgono
  for (let k = 0; k < 9; k++) {
    const by = alto + 3 + ((((k * 13 - tempoLivello * 0.3) % 22) + 22) % 22);
    ctx.fillRect((k * 23 + 7) % 160, Math.round(by), 1, 1);
  }
}

// ---- Lo sfondo della torre: cielo, nuvole e montagne che "scendono" mentre sali ----
let rocciaLaterale = null;   // la prepariamo la prima volta che serve
function creaRocciaLaterale() {
  const c = document.createElement("canvas"); c.width = 16; c.height = 256;
  const g = c.getContext("2d");
  for (let y = 0; y < 256; y++) for (let x = 0; x < 16; x++) {
    g.fillStyle = COLORI[casuale(x, y) < 0.15 ? 2 : casuale(y, x) < 0.08 ? 0 : 1];
    g.fillRect(x, y, 1, 1);
  }
  return c;
}
function disegnaSfondoTorre(camY) {
  if (!rocciaLaterale) rocciaLaterale = creaRocciaLaterale();
  ctx.fillStyle = COLORI[0]; ctx.fillRect(-4, -4, 168, 152);
  const massimo = mappa.length * T - 144;
  const base = 118 + (massimo - camY) * 0.15;          // più sali, più le montagne restano giù
  const tri = (x, p) => Math.abs(((x / p) % 1) * 2 - 1);
  ctx.fillStyle = COLORI[1];
  for (let x = 0; x < 160; x++) {
    const cima = Math.round(base - 20 * tri(x + 10, 53) - 8 * tri(x + 3, 21));
    if (cima < 144) ctx.fillRect(x, cima, 1, 150 - cima);
  }
  // Nuvole che si muovono piano
  for (let k = 0; k < 5; k++) {
    const nx = ((k * 47 + fotogramma * 0.04 * (k % 2 ? 1 : -1)) % 200 + 200) % 200 - 20;
    const ny = ((k * 67 - camY * 0.35) % 190 + 190) % 190 - 20;
    ctx.fillStyle = COLORI[1];
    ctx.fillRect(Math.round(nx), Math.round(ny), 22, 3); ctx.fillRect(Math.round(nx) + 4, Math.round(ny) - 2, 12, 2);
  }
  // Pilastri di roccia sullo sfondo ai lati (si muovono più lenti: profondità)
  const off = Math.round(camY * 0.6) % 256;
  for (const x of [8, 136]) {
    ctx.drawImage(rocciaLaterale, x, -off); ctx.drawImage(rocciaLaterale, x, 256 - off);
  }
}

// ---- Il pipistrello: dorme appeso finché Pip non gli passa sotto, poi lo insegue ----
function aggiornaPipistrello(n) {
  if (!n.sveglio) {
    if (Math.abs(pip.x - n.x) < 44 && pip.y > n.y && pip.y - n.y < 96) { n.sveglio = true; suona([1500, 1800, 1500], 0.04, 0.03); }
    return;
  }
  n.vx = Math.max(-0.9, Math.min(0.9, n.vx + Math.sign(pip.x - n.x) * 0.04));
  n.vy = Math.max(-0.7, Math.min(0.7, n.vy + Math.sign(pip.y - 4 - n.y) * 0.035));
  n.x = Math.max(8, Math.min(144, n.x + n.vx));
  n.y += n.vy + Math.sin(fotogramma * 0.2) * 0.3;
}

// ---- La panoramica iniziale: la telecamera sale fino in cima e torna giù ----
function iniziaPanoramica() {
  stato = "panoramica"; timerStato = 0;
  scena = { partenza: telecameraY };
  const d = document.getElementById("dialogo");
  d.classList.remove("nascosto", "avviso"); d.classList.add("alto"); d.textContent = "";
}
function aggiornaPanoramica() {
  const t = ++timerStato, p = scena.partenza;
  if (t <= 260) telecameraY = p * (1 - morbido(t / 260));             // sale
  else if (t > 440) telecameraY = p * morbido((t - 440) / 150);       // torna giù
  scriviFrasi([[0, "La batteria è in cima alla torre di roccia..."], [260, "La usa un condor meccanico per volare!"], [440, "Sbrigati: dal basso sale l'acido!"]], t);
  if (t >= 590) finePanoramica();
}
function finePanoramica() {
  telecameraY = scena.partenza; stato = "gioco";
  document.getElementById("dialogo").classList.add("nascosto");
  // Nella torre gli stivali-razzo fanno la differenza: lo ricordiamo al giocatore
  if (pip.stivali) { avviso("Hai gli stivali-razzo! Tieni premuto il salto per volare più in alto"); avvisoTimer = 360; }
}

// =====================================================================
//  🦅 IL BOSS DEL LIVELLO 2: il condor meccanico
//  Volteggia in alto, poi all'improvviso attacca con tre traiettorie diverse.
//  Dopo la terza si posa sul trespolo a riprendere fiato: colpiscilo al petto!
// =====================================================================
const CONDOR = { vita: 8, velocitaPiume: 1.6 };
const SEQUENZA_CONDOR = [
  { azione: "volteggia", durata: 120 },
  { azione: "strillo" },                  // il segnale: sta per attaccare!
  { azione: "picchiata" },                // 1. si tuffa dritto verso Pip
  { azione: "volteggia", durata: 90 },
  { azione: "strillo" },
  { azione: "radente" },                  // 2. rientra rasoterra da un lato
  { azione: "volteggia", durata: 90 },
  { azione: "piume" },                    // 3. pioggia di piume taglienti
  { azione: "posa", durata: 120 },        // si riposa su una piattaforma bassa: è il momento!
];
// Per riposarsi si posa su una delle due piattaforme basse: sceglie quella più lontana da Pip
const POSATOI = [{ x: 20, y: 14 * T - 16 }, { x: 116, y: 14 * T - 16 }];
const casaCondor = t => ({ x: 68 + Math.sin(t * 0.025) * 48, y: 14 + Math.sin(t * 0.05) * 4 });

function creaCondor() {
  return { tipo: "condor", x: 68, y: -30, vita: CONDOR.vita, vitaMax: CONDOR.vita, fase: "arrivo",
           passo: 0, timer: 0, lampo: 0, verso: 1, ali: 0, casa: 0, traiettoria: null, posato: false, strilla: false };
}

function eseguiPassoCondor(b) {
  const p = SEQUENZA_CONDOR[b.passo];
  const t = ++b.timer;
  let finito = false;
  b.ali++;
  switch (p.azione) {
    case "volteggia": {
      const h = casaCondor(++b.casa);
      b.verso = h.x >= b.x ? 1 : -1;
      b.x += (h.x - b.x) * 0.06; b.y += (h.y - b.y) * 0.06;
      finito = t >= p.durata;
      break;
    }
    case "strillo":
      if (t === 1) SUONI.strillo();
      b.strilla = t < 28; finito = t >= 28;
      break;
    case "picchiata": {
      if (t === 1) {
        // Una curva che passa esattamente dove si trova Pip in questo momento
        const x2 = b.x < 68 ? 150 : -14, y2 = 10, mx = pip.x - 8, my = pip.y - 4;
        b.traiettoria = { x0: b.x, y0: b.y, x1: 2 * mx - (b.x + x2) / 2, y1: 2 * my - (b.y + y2) / 2, x2, y2 };
      }
      const k = Math.min(t / 80, 1), u = 1 - k, tr = b.traiettoria;
      const nx = u * u * tr.x0 + 2 * u * k * tr.x1 + k * k * tr.x2;
      b.verso = nx >= b.x ? 1 : -1;
      b.x = nx; b.y = u * u * tr.y0 + 2 * u * k * tr.y1 + k * k * tr.y2;
      b.ali++;
      finito = k >= 1;
      break;
    }
    case "radente": {
      if (t === 1) b.traiettoria = { lato: b.x < 68 ? -1 : 1, x0: b.x, y0: b.y };
      const tr = b.traiettoria, fuori = tr.lato < 0 ? -34 : 170, affaccio = tr.lato < 0 ? -12 : 148;
      if (t <= 50) {                                   // esce dallo schermo
        const k = morbido(t / 50);
        b.x = tr.x0 + (fuori - tr.x0) * k; b.y = tr.y0 + (118 - tr.y0) * k;
      } else if (t <= 85) {                            // si affaccia: preparati!
        b.x = affaccio; b.y = 118; b.verso = -tr.lato;
        if (t === 51) SUONI.strillo();
      } else {                                         // attraversa rasoterra
        b.x -= tr.lato * 2.2; b.ali++;
        finito = b.x < -34 || b.x > 170;
      }
      break;
    }
    case "piume": {
      if (t === 1) b.traiettoria = { x0: b.x, y0: b.y, x2: b.x < 68 ? 140 : -4 };
      const tr = b.traiettoria, k = Math.min(t / 110, 1);
      const nx = tr.x0 + (tr.x2 - tr.x0) * k;
      b.verso = nx >= b.x ? 1 : -1;
      b.x = nx; b.y = tr.y0 + (26 - tr.y0) * Math.min(1, t / 20);
      if (t === 30 || t === 60 || t === 90) {
        const dx = pip.x - (b.x + 12);
        colpiNemici.push({ x: b.x + 10, y: b.y + 12, w: 3, h: 5, vx: Math.sign(dx) * Math.min(0.8, Math.abs(dx) / 80), vy: CONDOR.velocitaPiume, piuma: true });
        suona([900, 600], 0.03, 0.03);
      }
      finito = k >= 1;
      break;
    }
    case "posa": {
      if (t === 1) {
        const meta = Math.abs(pip.x - POSATOI[0].x) > Math.abs(pip.x - POSATOI[1].x) ? POSATOI[0] : POSATOI[1];
        b.traiettoria = { x0: b.x, y0: b.y, meta };
      }
      const meta = b.traiettoria.meta;
      if (t <= 40) {
        const k = morbido(t / 40), tr = b.traiettoria;
        b.x = tr.x0 + (meta.x - tr.x0) * k; b.y = tr.y0 + (meta.y - tr.y0) * k;
        b.verso = meta.x < 68 ? 1 : -1;               // si gira verso il centro
      } else { b.posato = true; b.x = meta.x; b.y = meta.y; if (t === 45) SUONI.strillo(); }
      finito = t >= p.durata;
      if (finito) b.posato = false;
      break;
    }
  }
  if (finito) { b.passo = (b.passo + 1) % SEQUENZA_CONDOR.length; b.timer = 0; }
}

function aggiornaCondor() {
  const b = boss;
  if (b.lampo) b.lampo--;
  if (b.fase === "lotta") eseguiPassoCondor(b);
  if (b.fase === "esplode") {
    b.timer++; b.ali++;
    b.y = Math.min(b.y + 0.4, 17 * T - 16);                     // precipita mentre esplode
    if (b.timer % 6 === 0) effetti.push({ tipo: "boom", x: b.x + Math.random() * 24, y: b.y + Math.random() * 16, t: 0 });
    if (b.timer % 20 === 0) SUONI.esplosione();
    scossa = Math.max(scossa, 2);
    if (b.timer >= 150) {
      b.fase = "sconfitto";
      pezzoCadente = { x: b.x + 8, y: b.y + 4, vx: pip.x < b.x ? -0.6 : 0.6, vy: -2.5 };
      for (let k = 0; k < 12; k++) effetti.push({ tipo: "boom", x: b.x + Math.random() * 24, y: b.y + Math.random() * 16, t: -k });
    }
  }
  if (b.fase === "lotta" && toccano(pip, { x: b.x + 4, y: b.y + 4, w: 16, h: 10 })) danneggia();
  aggiornaPezzoCadente();
}

function colpisciCondor(c) {
  const b = boss;
  if (b.fase !== "lotta" || c.vita <= 0) return;
  // Il petto con la batteria: basta colpirlo all'altezza giusta, da qualsiasi lato. Sopra e sotto ci sono le ali corazzate
  if (toccano(c, { x: b.x + 3, y: b.y + 6, w: 18, h: 7 })) {
    c.vita = 0; b.vita--; b.lampo = 12; SUONI.colpito();
    if (b.vita <= 0) { b.fase = "esplode"; b.timer = 0; b.posato = false; colpiNemici = []; }
  } else if (toccano(c, { x: b.x + 2, y: b.y + 2, w: 20, h: 12 })) {
    c.vita = 0; SUONI.clink();                                         // le ali sono corazzate
  }
}

function disegnaCondor(cam) {
  const b = boss;
  if (b.fase === "sconfitto") return;
  if ((b.lampo && fotogramma % 4 < 2) || (b.fase === "esplode" && fotogramma % 6 < 3)) return;
  const frame = b.posato ? "condor2" : Math.floor(b.ali / 6) % 2 ? "condor1" : "condor2";
  disegnaSprite(frame, b.x - cam, b.y, b.verso < 0);
  // La batteria nel petto che pulsa
  ctx.fillStyle = COLORI[Math.floor(fotogramma / 8) % 2 ? 0 : 1];
  ctx.fillRect(Math.round(b.x) + 10 - cam, Math.round(b.y) + 9, 4, 3);
  if (b.strilla && fotogramma % 6 < 3) { ctx.fillStyle = COLORI[0]; ctx.fillRect(Math.round(b.x) + (b.verso < 0 ? 3 : 20) - cam, Math.round(b.y) + 6, 1, 1); }
  if (b.posato) disegnaFumetto(Math.round(b.x) - cam + (b.x < 68 ? 22 : -26), Math.round(b.y) - 13, "KRAAA!", Math.max(0, b.timer - 44));
}

// Nella panoramica il condor volteggia in cima, senza combattere
function disegnaCondorInCima() {
  const h = casaCondor(timerStato);
  h.y += 34;                                    // un po' più in basso, così i messaggi in alto non lo coprono
  disegnaSprite(Math.floor(timerStato / 6) % 2 ? "condor1" : "condor2", h.x, h.y, Math.cos(timerStato * 0.025) < 0);
  ctx.fillStyle = COLORI[Math.floor(timerStato / 8) % 2 ? 0 : 1];
  ctx.fillRect(Math.round(h.x) + 10, Math.round(h.y) + 9, 4, 3);
}

// ---- La presentazione del condor ----
const FRASI_CONDOR = [
  [70, "Un condor meccanico piomba dal cielo!"],
  [150, "La batteria gli fa battere le ali!"],
  [300, `Colpiscilo al petto ${CONDOR.vita} volte!`],
];
function chiudiArena() { for (let x = 7; x <= 12; x++) mappa[17][x] = "#"; }
function iniziaCondorIntro() {
  stato = "bossIntro"; timerStato = 0;
  boss = creaCondor(); colpiNemici = []; colpi = []; avvisoTimer = 0;
  checkpointBoss = true; moneteCheckpoint = monete;
  chiudiArena(); SUONI.botta(); SUONI.rombo();
  const d = document.getElementById("dialogo");
  d.classList.remove("avviso"); d.classList.add("alto"); d.textContent = "";
}
function aggiornaCondorIntro() {
  const bi = ++timerStato, b = boss;
  pip.vx = 0; pip.aTerra = muovi(pip).pavimento;
  telecameraY += (0 - telecameraY) * 0.12;
  b.ali++;
  if (bi <= 70) { const h = casaCondor(bi); b.x += (h.x - b.x) * 0.1; b.y += (h.y - b.y) * 0.1; b.verso = Math.cos(bi * 0.025) < 0 ? -1 : 1; }
  if (bi === 70) { SUONI.strillo(); b.traiettoria = { x0: b.x, y0: b.y }; }
  if (bi > 70 && bi <= 95) {                             // la picchiata improvvisa verso lo schermo
    const k = morbido((bi - 70) / 25), tr = b.traiettoria;
    b.x = tr.x0 + (68 - tr.x0) * k; b.y = tr.y0 + (56 - tr.y0) * k; b.ali++;
    if (bi === 95) scossa = 10;
  }
  if (bi > 300) { b.y += (14 - b.y) * 0.06; }            // torna in alto
  const d = document.getElementById("dialogo");
  const frase = FRASI_CONDOR.filter(f => f[0] <= bi).pop();
  d.classList.toggle("nascosto", !frase);
  if (frase) d.textContent = frase[1].slice(0, Math.floor((bi - frase[0]) / 2));
  if (bi >= FINE_PRESENTAZIONE) { stato = "gioco"; b.fase = "lotta"; b.casa = 0; d.classList.add("nascosto"); }
}
function disegnaPrimoPianoCondor(bi) {
  ctx.fillStyle = COLORI[1]; ctx.fillRect(0, 0, 160, 62);
  ctx.fillStyle = COLORI[2];
  for (let k = 0; k < 6; k++) ctx.fillRect((((k * 37 - bi * 4) % 160) + 160) % 160, 5 + k * 10, 24, 1);
  const su = Math.floor(bi / 8) % 2;
  ctx.drawImage(SPRITE[su ? "condor1" : "condor2"], 32, -2, 96, 64);                 // ingrandito 4 volte
  ctx.fillStyle = COLORI[su ? 0 : 1]; ctx.fillRect(72, 34, 16, 12);                   // la batteria che pulsa
  ctx.fillStyle = COLORI[3]; ctx.fillRect(78, 32, 4, 2); ctx.fillRect(76, 38, 8, 1); ctx.fillRect(79, 36, 2, 6);   // con il simbolo "+"
  ctx.fillStyle = COLORI[0];
  for (let k = 0; k < 6; k++) ctx.fillRect(Math.round(66 + Math.random() * 28), Math.round(28 + Math.random() * 22), 1, 1);   // scintille
}

// Il pezzo liberato dal boss vola fuori e si posa dove c'è terreno libero
function aggiornaPezzoCadente() {
  if (!pezzoCadente) return;
  const p = pezzoCadente, minX = boss && (boss.tipo === "robot" || boss.tipo === "gorilla") ? arenaX() + 8 : 8;
  p.vy = Math.min(p.vy + 0.15, 3); p.y += p.vy;
  p.x = Math.max(minX, Math.min(larghezza * T - 16, p.x + p.vx));
  const cx = Math.floor((p.x + 4) / T), cy = Math.floor((p.y + 8) / T);
  const arrivaDallAlto = p.y + 8 - p.vy <= cy * T;
  if (p.vy > 0 && solido(cx, cy) && arrivaDallAlto) {
    mappa[cy - 1][cx] = "M"; pezzoCadente = null; SUONI.moneta();
  }
}

// =====================================================================
//  🤖 IL BOSS DEL LIVELLO 1: il robot guardiano
//  Come nei vecchi giochi arcade ripete sempre la stessa sequenza di mosse:
//  il giocatore la impara e diventa sempre più bravo a schivarla.
//  Prova a cambiarla, aggiungendo, togliendo o riordinando i passi!
// =====================================================================
const ROBOT = {
  vita: 8,               // colpi alla testa per sconfiggerlo
  velocitaColpi: 1.6,
  velocitaPasso: 0.5,
};
// Altezza della canna del braccio, in pixel dalla cima del robot.
// "mirata" è speciale: il robot punta la canna all'altezza di Pip in quel momento
const ALTEZZE = { bassa: 36, alta: 26, ventaglio: 30 };
function altezzaCanna(b, nome) {
  if (nome === "mirata") return Math.max(14, Math.min(38, pip.y + 3 - b.y));
  return ALTEZZE[nome];
}
// "verso" = posizione nell'arena, in pixel dal bordo sinistro dello schermo
const SEQUENZA_ROBOT = [
  { azione: "spara", altezza: "bassa" },        // colpo basso: salta!
  { azione: "spara", altezza: "alta" },         // colpo alto: resta a terra!
  { azione: "spara", altezza: "bassa" },
  { azione: "ride", durata: 90 },               // si ferma a ridere: è il momento di colpirlo!
  { azione: "cammina", verso: 144 },            // indietreggia
  { azione: "raffica", altezza: "bassa", colpi: 2 },
  { azione: "spara", altezza: "mirata" },       // ti cerca, anche sulla piattaforma
  { azione: "attendi", durata: 40 },
  { azione: "salta", verso: 116, su: true },    // sulla piattaforma alta
  { azione: "ventaglio" },                      // tre colpi in diagonale
  { azione: "attendi", durata: 30 },
  { azione: "ventaglio" },
  { azione: "attendi", durata: 30 },
  { azione: "salta", verso: 80, su: false },    // giù, vicino a Pip
  { azione: "spara", altezza: "mirata" },
  { azione: "attendi", durata: 30 },
  { azione: "cammina", verso: 112 },            // torna al punto di partenza
];
const TERRA_BOSS = 88, PIATTAFORMA_BOSS = 32;   // dove poggia i piedi il robot
const arenaX = () => LIVELLI[livello].boss.arena * T;

function creaBoss() {
  return {
    tipo: "robot", vitaMax: ROBOT.vita,
    x: arenaX() + 112, y: -48, vita: ROBOT.vita, fase: "arrivo", passo: 0, timer: 0,
    canna: ALTEZZE.bassa, cannaObiettivo: ALTEZZE.bassa, lampo: 0, fiammata: 0, gambe: 0, salto: null,
  };
}

function sparaBoss(b, vx, vy) {
  colpiNemici.push({ x: b.x - 12, y: b.y + b.canna - 2, w: 4, h: 4, vx, vy });
  b.fiammata = 6;
  SUONI.sparoBoss();
}

// Esegue un passo della sequenza; quando il passo finisce passa al successivo
function eseguiPasso(b) {
  const p = SEQUENZA_ROBOT[b.passo];
  const t = ++b.timer;
  let finito = false;
  switch (p.azione) {
    case "spara":           // prima prende la mira (la canna si muove), poi fa fuoco
      if (t < 18) b.cannaObiettivo = altezzaCanna(b, p.altezza);   // la mira si blocca poco prima del colpo
      if (t === 22) sparaBoss(b, -ROBOT.velocitaColpi, 0);
      finito = t >= 34;
      break;
    case "raffica":
      b.cannaObiettivo = altezzaCanna(b, p.altezza);
      if (t >= 20 && (t - 20) % 18 === 0 && t < 20 + 18 * p.colpi) sparaBoss(b, -ROBOT.velocitaColpi, 0);
      finito = t >= 20 + 18 * p.colpi;
      break;
    case "ventaglio":
      b.cannaObiettivo = ALTEZZE.ventaglio;
      if (t === 20) [0.5, 0.9, 1.3].forEach(vy => sparaBoss(b, -1.4, vy));
      finito = t >= 30;
      break;
    case "attendi":
      finito = t >= p.durata;
      break;
    case "ride":
      if (t === 1) SUONI.risata();
      b.risata = t;
      finito = t >= p.durata;
      if (finito) b.risata = 0;
      break;
    case "cammina": {
      const meta = arenaX() + p.verso;
      b.x += Math.sign(meta - b.x) * ROBOT.velocitaPasso;
      b.gambe++;
      if (Math.abs(meta - b.x) < ROBOT.velocitaPasso) { b.x = meta; finito = true; }
      break;
    }
    case "salta": {
      if (t === 1) b.salto = { x0: b.x, y0: b.y, x1: arenaX() + p.verso, y1: p.su ? PIATTAFORMA_BOSS : TERRA_BOSS };
      const s = b.salto, k = Math.min(t / 50, 1);
      // Salendo si alza prima di spostarsi; scendendo si sposta prima di cadere
      const kx = p.su ? k * k : Math.sqrt(k);
      b.x = s.x0 + (s.x1 - s.x0) * kx;
      b.y = s.y0 + (s.y1 - s.y0) * k - 160 * k * (1 - k);
      if (k >= 1) { scossa = 10; SUONI.schianto(); finito = true; }
      break;
    }
  }
  if (finito) { b.passo = (b.passo + 1) % SEQUENZA_ROBOT.length; b.timer = 0; }
}

function aggiornaBoss() {
  const b = boss;
  if (b.lampo) b.lampo--;
  if (b.fiammata) b.fiammata--;
  b.canna += (b.cannaObiettivo - b.canna) * 0.2;

  if (b.fase === "lotta") eseguiPasso(b);

  if (b.fase === "esplode") {
    // Una catena di esplosioni, poi il robot va in pezzi e l'ingranaggio cade a terra
    b.timer++;
    if (b.timer % 6 === 0) effetti.push({ tipo: "boom", x: b.x + Math.random() * 16, y: b.y + Math.random() * 40, t: 0 });
    if (b.timer % 20 === 0) SUONI.esplosione();
    scossa = Math.max(scossa, 2);
    if (b.timer >= 150) {
      b.fase = "sconfitto";
      pezzoCadente = { x: b.x + 4, y: b.y + 3, vx: -0.8, vy: -2.5 };   // schizza fuori verso Pip
      for (let k = 0; k < 12; k++) effetti.push({ tipo: "boom", x: b.x + Math.random() * 16, y: b.y + Math.random() * 40, t: -k });
    }
  }

  // Toccare il robot fa male
  if (b.fase === "lotta" && toccano(pip, { x: b.x + 2, y: b.y + 2, w: 12, h: 38 })) return danneggia();

  aggiornaPezzoCadente();
}

// Controlla se un colpo di Pip prende il robot: solo la testa gli fa male
function colpisciBoss(c) {
  if (boss && boss.tipo === "condor") return colpisciCondor(c);
  if (boss && boss.tipo === "organo") return;   // il guardiano non si batte sparando: si batte con la musica
  if (boss && boss.tipo === "gorilla") return colpisciGorilla(c);
  const b = boss;
  if (!b || b.fase !== "lotta" || c.vita <= 0) return;
  if (toccano(c, { x: b.x + 2, y: b.y + 2, w: 12, h: 14 })) {
    c.vita = 0; b.vita--; b.lampo = 12; SUONI.colpito();
    if (b.vita <= 0) { b.fase = "esplode"; b.timer = 0; colpiNemici = []; }
  } else if (toccano(c, { x: b.x, y: b.y + 16, w: 16, h: 24 })) {
    c.vita = 0; SUONI.clink();   // sul corpo corazzato i colpi rimbalzano
  }
}

function disegnaPrimoPianoBoss(bi) {

function disegnaBoss(cam) {
  const b = boss;
